{% extends "base.html" %}
{% block title %}할일 수정{% endblock %}
{% block content %}
<form class="card edit-form" method="post">
  <label>할 일
    <input type="text" name="title" value="{{ todo.title }}" required autofocus>
  </label>
  <label>우선순위
    <select name="priority">
      {% for key, label in priorities.items() %}
        <option value="{{ key }}" {% if key == todo.priority %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>마감일
    <input type="date" name="due_date" value="{{ todo.due_date or '' }}">
  </label>
  <div class="actions">
    <a href="{{ url_for('index') }}" class="btn">취소</a>
    <button type="submit" class="btn primary">저장</button>
  </div>
</form>
{% endblock %}
